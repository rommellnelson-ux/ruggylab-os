[build-system]
# setuptools >= 77.0.3 est requis pour l'expression de licence PEP 639
# (`license` en chaîne SPDX et `license-files`). Une version antérieure
# ignorerait silencieusement ces champs : la distribution partirait sans licence
# déclarée, ce qui est précisément le défaut que cette version corrige.
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ruggylab-os"
version = "0.8.0b1"
description = "RuggyLab OS - Laboratory Management System"
readme = "README.md"
requires-python = ">=3.11"
# Licence propriétaire d'évaluation. Pas de classifier `License :: OSI Approved`,
# réservé aux licences approuvées par l'Open Source Initiative : l'annoncer
# serait faux. `LicenseRef-…` est la forme SPDX prévue pour une licence non
# répertoriée.
license = "LicenseRef-RuggyLab-Evaluation-1.0"
license-files = [
    "LICENSE.md",
    "THIRD_PARTY_NOTICES.md",
    # Glob récursif : `licenses/third-party/*` ne prendrait que les fichiers
    # à la racine du dossier, pas les textes rangés par paquet — c'est-à-dire
    # justement ceux que les licences tierces exigent de conserver.
    "licenses/third-party/**/*",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Découverte explicite : le dépôt contient plusieurs répertoires racine (`app`,
# `tests`, `scripts`, `alembic`) et l'auto-détection de setuptools échoue faute
# de savoir lequel est le paquet. Seul `app` est distribué.
[tool.setuptools.packages.find]
include = ["app*"]
namespaces = false

# Fichiers non-Python à embarquer : templates, statiques et référentiels sont
# nécessaires au fonctionnement, et leur absence ne se verrait qu'à l'exécution.
[tool.setuptools.package-data]
app = [
    "templates/**/*",
    "static/**/*",
    "data/**/*",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true
show_error_codes = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "alembic/versions"]
skips = ["B101", "B601"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "W",
    "UP",
    "B",
    "C4",
    "SIM",
    "S",
]
ignore = [
    "E501",
    "S101",
    "S311",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "SIM", "N"]
"alembic/versions/*" = ["ALL"]
"scripts/*" = ["S", "T", "I", "N"]
# FHIR R4 mandates camelCase field names (resourceType, effectiveDateTime…)
"app/schemas/fhir.py" = ["N815"]
