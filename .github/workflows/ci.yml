name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, feat/acquisition-3-flux ]
  workflow_dispatch:

# Moindre privilège par défaut : chaque job qui a besoin de plus le déclare
# lui-même. Accorder `security-events: write` et `packages: write` globalement
# les donnait à TOUS les jobs, y compris ceux qui exécutent du code de test —
# une élévation inutile sur la surface la plus exposée du pipeline.
#   security-events: write -> job `codeql` seul
#   packages: write        -> job `deploy` seul
#   contents: write        -> job `release` seul
permissions:
  contents: read

jobs:
  test:
    name: Lint, type-check, security and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit pip-audit detect-secrets mypy

      # ── Hard gates (must pass) ──────────────────────────────────────────────
      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy (type check)
        run: mypy app

      - name: Bandit security scan
        run: bandit -q -r app -c pyproject.toml

      # Les workflows portent désormais le verrouillage du pipeline de release :
      # une erreur de syntaxe ou d'expression y serait un trou de sécurité, pas
      # une simple gêne. On les valide donc comme du code.
      # Binaire téléchargé depuis une release épinglée plutôt qu'une action
      # tierce : une dépendance de moins à auditer (§11 supply-chain).
      - name: Actionlint (validation des workflows)
        env:
          ACTIONLINT_VERSION: "1.7.7"
          # SHA-256 de actionlint_1.7.7_linux_amd64.tar.gz, INSCRIT EN DUR ICI.
          # Un tag de release GitHub est mutable : télécharger le checksum depuis
          # la même release ne prouverait rien, puisqu'un attaquant capable de
          # remplacer l'archive remplacerait aussi le fichier de checksums.
          # Cette valeur a été vérifiée deux fois : calcul local sur l'archive
          # téléchargée, et comparaison au `actionlint_1.7.7_checksums.txt`
          # publié. Toute mise à jour de version doit la recalculer.
          ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
        run: |
          curl -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
          # `-shellcheck=` désactive l'intégration shellcheck. Ce qu'on veut ici,
          # c'est valider la SYNTAXE et les EXPRESSIONS des workflows — le
          # verrouillage du pipeline de release en dépend. Shellcheck remonte par
          # ailleurs une dizaine d'avertissements de style (SC2015, SC2034…) dans
          # des scripts `run:` préexistants et sans rapport : les corriger ici
          # serait un nettoyage collatéral, à traiter séparément.
          ./actionlint -color -shellcheck=
          rm -f actionlint actionlint.tar.gz

      - name: Test suite
        run: pytest

      # ── Advisory gates (depend on external state — run and report, never block) ──
      - name: Dependency audit (advisory)
        continue-on-error: true
        run: pip-audit -r requirements.txt

      - name: Secret scan (advisory)
        continue-on-error: true
        run: python -m detect_secrets.pre_commit_hook --baseline .secrets.baseline $(git ls-files)

  # ── Image candidate : construite UNE SEULE FOIS ────────────────────────────
  # Une image auditée par un job et reconstruite par un autre ne sont pas la
  # même image. Deux constructions successives du même Dockerfile peuvent
  # différer — horodatages, résolution de paquets, couches de cache — et les
  # preuves décriraient alors une image qui n'est pas celle qu'on publie.
  #
  # Ce job produit donc UN artefact, que tous les autres chargent sans
  # reconstruire, et que `deploy` pousse tel quel. L'archive n'est publiée que
  # comme artefact interne de la CI : rien n'est poussé sur GHCR depuis une PR.
  build-candidate:
    name: Image candidate (construite une seule fois)
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_id: ${{ steps.identity.outputs.image_id }}
      archive_sha256: ${{ steps.identity.outputs.archive_sha256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Build the candidate image
        run: docker build -t ruggylab-os:candidate .

      - name: Export the candidate image and record its identity
        id: identity
        run: |
          mkdir -p artifacts
          docker save ruggylab-os:candidate | gzip -1 > artifacts/candidate-image.tar.gz

          image_id=$(docker image inspect ruggylab-os:candidate --format '{{.Id}}')
          archive_sha256=$(sha256sum artifacts/candidate-image.tar.gz | cut -d' ' -f1)
          base=$(grep -m1 '^FROM python:' Dockerfile | awk '{print $2}')
          read -r os arch < <(docker image inspect ruggylab-os:candidate \
            --format '{{.Os}} {{.Architecture}}')

          {
            echo "image_id=$image_id"
            echo "archive_sha256=$archive_sha256"
          } >> "$GITHUB_OUTPUT"

          python - <<PY
          import json, os, pathlib
          pathlib.Path("artifacts/candidate-image.json").write_text(
              json.dumps(
                  {
                      "image_id": "$image_id",
                      "archive_file": "candidate-image.tar.gz",
                      "archive_sha256": "$archive_sha256",
                      "base_image_reference": "$base",
                      "git_sha": os.environ["GITHUB_SHA"],
                      "git_ref": os.environ["GITHUB_REF"],
                      "workflow_run_id": os.environ["GITHUB_RUN_ID"],
                      "platform": "$os/$arch",
                      "os": "$os",
                      "architecture": "$arch",
                      "builder": "docker build (BuildKit)",
                      "_comment": (
                          "Identite de l'artefact candidat. Tous les jobs de "
                          "qualification chargent CETTE archive ; deploy pousse "
                          "CETTE image, sans reconstruire."
                      ),
                  },
                  indent=2,
                  ensure_ascii=False,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          cat artifacts/candidate-image.json

      - name: Publier l'image candidate (artefact interne, jamais GHCR)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: candidate-image
          path: |
            artifacts/candidate-image.tar.gz
            artifacts/candidate-image.json
          # Courte : l'archive pese ~130 Mo et ne sert qu'a ce run.
          retention-days: 1
          if-no-files-found: error

  test-postgres:
    name: Migrations + flux clinique E2E (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ruggylab
          POSTGRES_PASSWORD: ruggylab_test
          POSTGRES_DB: ruggylab_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations (upgrade)
        env:
          DATABASE_URL: postgresql+psycopg://ruggylab:ruggylab_test@localhost:5432/ruggylab_test
          SECRET_KEY: ci-secret-key-minimum-32-characters-long
          FIRST_SUPERUSER_PASSWORD: CiPassword123!Secure
        run: alembic upgrade head

      - name: Verify migration idempotency (downgrade → upgrade)
        env:
          DATABASE_URL: postgresql+psycopg://ruggylab:ruggylab_test@localhost:5432/ruggylab_test
          SECRET_KEY: ci-secret-key-minimum-32-characters-long
          FIRST_SUPERUSER_PASSWORD: CiPassword123!Secure
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Verify clinical, analyzer, and laboratory-number locking on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://ruggylab:ruggylab_test@localhost:5432/ruggylab_test
          SECRET_KEY: ci-secret-key-minimum-32-characters-long
          FIRST_SUPERUSER_PASSWORD: CiPassword123!Secure
          TESTING: "true"
        run: >
          python -m pytest -q
          tests/test_clinical_safety_postgres.py
          tests/test_analyzer_idempotency_r6_postgres.py
          tests/test_lab_numbering_r5_postgres.py
          tests/test_preanalytic_cancelled_sample_postgres.py
          tests/test_quality_transaction_postgres.py
          tests/test_finance_transaction_postgres.py
          tests/test_imaging_transaction_postgres.py
          tests/test_auth_session_postgres.py
          tests/test_equipment_registry_postgres.py

      - name: Smoke-test app startup against PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://ruggylab:ruggylab_test@localhost:5432/ruggylab_test
          SECRET_KEY: ci-secret-key-minimum-32-characters-long
          FIRST_SUPERUSER_PASSWORD: CiPassword123!Secure
          TESTING: "true"
        run: |
          python - <<'EOF'
          import os
          os.environ.setdefault("TESTING", "true")
          from sqlalchemy import text

          from app.db.session import engine

          with engine.connect() as conn:
              count = conn.execute(text("SELECT count(*) FROM users")).scalar()
          print(f"PostgreSQL smoke-test OK — {count} user(s) in DB")
          EOF

      # ── Flux clinique complet sur PostgreSQL (bloquant) ──────────────────────
      # patient → échantillon → prescription → rattachement → résultat → fil →
      # cloisonnement comptable → facture → encaissement → synthèse.
      # Réutilise scripts/uat_smoke.py (le « 15/15 » de la checklist go-live),
      # exécuté ici contre une instance réelle adossée à PostgreSQL 16.
      - name: Start application against PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://ruggylab:ruggylab_test@localhost:5432/ruggylab_test
          SECRET_KEY: ci-secret-key-minimum-32-characters-long
          FIRST_SUPERUSER_PASSWORD: CiPassword123!Secure
          CACHE_BACKEND: memory
          ENABLE_DH36_LISTENER: "false"
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 --log-level warning > uvicorn-pg.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v1/health && break || sleep 1
          done

      - name: Run clinical flow E2E (uat_smoke) against PostgreSQL
        env:
          UAT_BASE_URL: http://127.0.0.1:8000
          FIRST_SUPERUSER_PASSWORD: CiPassword123!Secure
        run: python -m scripts.uat_smoke

      - name: Upload app log on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: uvicorn-pg-log
          path: uvicorn-pg.log
          if-no-files-found: ignore

  # ── Sauvegarde → restauration → application (bloquant) ─────────────────────
  # Une sauvegarde qu'on n'a jamais restaurée n'est pas une sauvegarde. Ce job
  # démontre le cycle complet sur PostgreSQL 16 jetable, avec des données
  # exclusivement SYNTHÉTIQUES : jamais de base réelle, jamais de donnée
  # patient, jamais d'export existant.
  backup-restore:
    name: Sauvegarde et restauration PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ruggylab
          POSTGRES_PASSWORD: ruggylab_test
          POSTGRES_DB: ruggylab_restore_src
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      PGHOST: localhost
      PGUSER: ruggylab
      PGPASSWORD: ruggylab_test
      SRC_DB: ruggylab_restore_src
      DST_DB: ruggylab_restore_verify
      SECRET_KEY: ci-secret-key-minimum-32-characters-long
      FIRST_SUPERUSER_PASSWORD: CiPassword123!Secure

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Le client doit correspondre au serveur : pg_dump refuse une version
      # serveur plus récente que la sienne, et l'image ubuntu-latest peut être
      # en retard sur PostgreSQL 16.
      - name: Install PostgreSQL 16 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSf -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          pg_dump --version

      - name: "1. Migrations jusqu'à la tête sur la base source"
        env:
          DATABASE_URL: postgresql+psycopg://ruggylab:ruggylab_test@localhost:5432/ruggylab_restore_src
        run: |
          alembic upgrade head
          head=$(alembic heads | head -1 | awk '{print $1}')
          echo "Tête appliquée : $head"
          test "$head" = "20260826_0043" || { echo "::error::tête inattendue $head"; exit 1; }

      - name: "2. Semis de données strictement synthétiques"
        run: |
          python -m scripts.backup_restore_verify seed \
            --url "postgresql+psycopg://ruggylab:ruggylab_test@localhost:5432/${SRC_DB}" \
            --manifest restore-manifest.json

      - name: "3. Sauvegarde (pg_dump format custom)"
        run: |
          pg_dump --format=custom --no-owner --no-privileges \
            --dbname "$SRC_DB" --file ruggylab-backup.dump
          ls -lh ruggylab-backup.dump
          test -s ruggylab-backup.dump || { echo "::error::dump vide"; exit 1; }

      # La base cible est créée VIDE : on prouve une restauration réelle, pas une
      # base source qu'on se contenterait de relire.
      - name: "4. Restauration dans une base vierge"
        run: |
          psql -d postgres -c "DROP DATABASE IF EXISTS ${DST_DB};"
          psql -d postgres -c "CREATE DATABASE ${DST_DB};"
          tables=$(psql -tAd "$DST_DB" -c \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public';")
          test "$tables" = "0" || { echo "::error::base cible non vierge ($tables tables)"; exit 1; }
          pg_restore --no-owner --no-privileges --dbname "$DST_DB" ruggylab-backup.dump
          echo "Restauration terminée."

      - name: "5. Vérification : comptages, relations, contraintes, index"
        run: |
          python -m scripts.backup_restore_verify verify \
            --url "postgresql+psycopg://ruggylab:ruggylab_test@localhost:5432/${DST_DB}" \
            --manifest restore-manifest.json

      # Preuve que la base restaurée est réellement exploitable, pas seulement
      # structurellement correcte.
      - name: "6. Démarrage de l'application sur la base RESTAURÉE"
        env:
          DATABASE_URL: postgresql+psycopg://ruggylab:ruggylab_test@localhost:5432/ruggylab_restore_verify
          CACHE_BACKEND: memory
          ENABLE_DH36_LISTENER: "false"
          ANALYZER_RAW_LISTENER_ENABLED: "false"
          CSA_SYNC_ENABLED: "false"
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8010 --log-level warning \
            > uvicorn-restore.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8010/api/v1/health && break || sleep 1
          done
          curl -sf http://127.0.0.1:8010/api/v1/health \
            || { echo "::error::l'application ne démarre pas sur la base restaurée"; exit 1; }

      # La preuve décisive : les lignes restaurées se relisent à travers toute
      # la pile applicative (auth, ORM, sérialisation), pas seulement en SQL.
      - name: "7. Smoke test API sur la base restaurée"
        run: |
          login=$(curl -s -o login.json -w '%{http_code}' \
            -X POST http://127.0.0.1:8010/api/v1/login/access-token \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "username=admin" \
            --data-urlencode "password=${FIRST_SUPERUSER_PASSWORD}")
          if [ "$login" != "200" ]; then
            echo "::error::authentification impossible (HTTP $login)"; head -c 400 login.json; exit 1
          fi
          token=$(python -c 'import json;print(json.load(open("login.json"))["access_token"])')
          test -n "$token" || { echo "::error::jeton absent"; exit 1; }

          code=$(curl -s -o patients.json -w '%{http_code}' \
            "http://127.0.0.1:8010/api/v1/patients?limit=100" \
            -H "Authorization: Bearer $token")
          if [ "$code" != "200" ]; then
            echo "::error::lecture des patients impossible (HTTP $code)"; head -c 400 patients.json; exit 1
          fi
          # Réponse paginée : {items: [...], meta: {total: N}}.
          total=$(python -c 'import json;d=json.load(open("patients.json"));print(d["meta"]["total"])')
          echo "Patients relus via l'API après restauration : $total"
          test "$total" -ge 3 \
            || { echo "::error::les patients restaurés ne sont pas lisibles via l'API"; exit 1; }

          # Les identités restaurées sont bien celles qui avaient été semées.
          python - <<'PY'
          import json, sys
          items = json.load(open("patients.json"))["items"]
          ipps = {p["ipp_unique_id"] for p in items}
          attendus = {"TEST-IPP-0001", "TEST-IPP-0002", "TEST-IPP-0003"}
          manquants = attendus - ipps
          if manquants:
              print(f"::error::IPP absents après restauration : {sorted(manquants)}")
              sys.exit(1)
          print(f"Les {len(attendus)} IPP synthétiques sont relus via l'API.")
          PY

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: backup-restore-logs
          path: |
            uvicorn-restore.log
            restore-manifest.json
          if-no-files-found: ignore

  # ── Conformité de licence et de distribution (bloquant) ────────────────────
  # Une image distribuée sans ses conditions d'usage ni les notices de ses
  # composants est incomplète — et plusieurs licences tierces l'exigent. Ce job
  # vérifie que les preuves existent réellement, au lieu de faire confiance aux
  # déclarations : il construit le paquet et l'image, puis regarde dedans.
  license-compliance:
    name: License and distribution compliance
    needs: build-candidate
    runs-on: ubuntu-latest
    env:
      # Syft épinglé par version : `latest` rendrait l'audit non reproductible,
      # et une chaîne d'approvisionnement non auditable ne prouve rien.
      SYFT_VERSION: "1.20.0"
      # SHA-256 de syft_1.20.0_linux_amd64.tar.gz, INSCRIT EN DUR ICI — même
      # raison que pour actionlint : un tag de release GitHub est mutable, et
      # télécharger `syft_1.20.0_checksums.txt` depuis la release qu'il vérifie
      # ne prouverait rien. Valeur vérifiée deux fois : fichier de checksums
      # officiel, et calcul local sur l'archive téléchargée.
      SYFT_SHA256: "689e12c5cbf67521ce61b9c126068f9eaabe1223e77971b2fede50033ff6b5cc"
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      # ── 1. Présence et cohérence des déclarations ─────────────────────────
      - name: "1. Fichiers de licence présents"
        run: |
          test -f LICENSE.md            || { echo "::error::LICENSE.md absent"; exit 1; }
          test -f THIRD_PARTY_NOTICES.md || { echo "::error::THIRD_PARTY_NOTICES.md absent"; exit 1; }
          test -d licenses/third-party   || { echo "::error::licenses/third-party absent"; exit 1; }

      - name: "2. Aucune déclaration GPL-2.0 active pour RUGGYLAB"
        run: |
          # Les documents d'audit citent l'ancien état à dessein : ils sont exclus.
          fautifs=$(grep -lE 'GPL-2\.0|GPLv2|General Public License' \
            pyproject.toml Dockerfile README.md LICENSE.md 2>/dev/null || true)
          if [ -n "$fautifs" ]; then
            echo "::error::déclaration GPL-2.0 active dans : $fautifs"; exit 1
          fi

      - name: "3. LicenseRef cohérent partout"
        env:
          REF: LicenseRef-RuggyLab-Evaluation-1.0
        run: |
          for f in pyproject.toml Dockerfile README.md LICENSE.md; do
            grep -q "$REF" "$f" || { echo "::error::$f ne porte pas $REF"; exit 1; }
          done
          echo "LicenseRef cohérent dans les 4 déclarations."

      # ── 2. Le paquet Python embarque bien les licences ────────────────────
      - name: "4. Construire le paquet et vérifier les licences embarquées"
        run: |
          python -m pip install --upgrade pip "setuptools>=77.0.3" build
          python -m build --outdir dist_ci
          python - <<'PY'
          import glob, sys, tarfile, zipfile
          whl = glob.glob("dist_ci/*.whl")[0]
          zf = zipfile.ZipFile(whl)
          noms = zf.namelist()
          lic = [n for n in noms if "LICENSE" in n or "THIRD_PARTY" in n or "licenses/" in n]
          meta = zf.read([n for n in noms if n.endswith("METADATA")][0]).decode()
          if not lic:
              print("::error::le wheel ne contient aucun fichier de licence"); sys.exit(1)
          if "LicenseRef-RuggyLab-Evaluation-1.0" not in meta:
              print("::error::METADATA du wheel sans License-Expression attendue"); sys.exit(1)
          sd = glob.glob("dist_ci/*.tar.gz")[0]
          with tarfile.open(sd) as t:
              slic = [n for n in t.getnames() if "LICENSE" in n or "THIRD_PARTY" in n]
          if not slic:
              print("::error::le sdist ne contient aucun fichier de licence"); sys.exit(1)
          print(f"wheel : {len(lic)} fichiers de licence — sdist : {len(slic)}")
          PY

      # ── 3. Inventaire depuis un environnement PROPRE ──────────────────────
      # Sur un poste de développement, l'inventaire remonte des outils absents
      # de requirements.txt (dont plusieurs sous GPL) et ferait apparaître un
      # risque copyleft qui n'existe pas dans l'image livrée.
      - name: "5. Inventaire des licences Python (environnement propre)"
        run: |
          python -m venv .venv-audit
          ./.venv-audit/bin/python -m pip install --quiet --upgrade pip
          ./.venv-audit/bin/python -m pip install --quiet -r requirements.txt
          ./.venv-audit/bin/python scripts/inventory_python_licenses.py \
            --root . \
            --json artifacts/python-licenses.json \
            --copy-licenses \
            --fail-on-unknown

      # ── 4. L'image contient réellement les licences ───────────────────────
      # L'image n'est PAS reconstruite : on charge l'artefact candidat, et l'on
      # verifie que son identifiant est bien celui que `build-candidate` a
      # publie. Une image differente ferait echouer ce job plutot que produire
      # une preuve portant sur autre chose.
      - name: Load the candidate image
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: candidate-image
          path: artifacts

      - name: Verify the loaded image is the audited candidate
        run: |
          gunzip -c artifacts/candidate-image.tar.gz | docker load
          docker tag ruggylab-os:candidate ruggylab-os:license-check
          attendu="${{ needs.build-candidate.outputs.image_id }}"
          obtenu=$(docker image inspect ruggylab-os:license-check --format '{{{{.Id}}}}')
          if [ "$obtenu" != "$attendu" ]; then
            echo "::error::image chargee ($obtenu) differente du candidat ($attendu)"
            exit 1
          fi
          sha=$(sha256sum artifacts/candidate-image.tar.gz | cut -d' ' -f1)
          if [ "$sha" != "${{ needs.build-candidate.outputs.archive_sha256 }}" ]; then
            echo "::error::archive alteree : $sha"
            exit 1
          fi
          echo "identite confirmee : $obtenu"

      - name: "6. Vérifier les licences à l'intérieur de l'image candidate"
        run: |
          for f in /app/LICENSE.md /app/THIRD_PARTY_NOTICES.md; do
            docker run --rm --entrypoint sh ruggylab-os:license-check -c "test -f $f" \
              || { echo "::error::$f absent de l'image"; exit 1; }
          done
          docker run --rm --entrypoint sh ruggylab-os:license-check \
            -c "test -d /app/licenses/third-party && ls /app/licenses/third-party" \
            || { echo "::error::/app/licenses/third-party absent de l'image"; exit 1; }
          echo "Licences présentes dans l'image."

      # ── 5. SBOM ───────────────────────────────────────────────────────────
      - name: "7. Installer Syft (version et empreinte épinglées)"
        run: |
          url="https://github.com/anchore/syft/releases/download"
          curl -sSfL -o syft.tar.gz "${url}/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  syft.tar.gz" | sha256sum --check --strict
          tar -xzf syft.tar.gz syft
          ./syft version

      - name: "8. Générer les SBOM CycloneDX et SPDX"
        run: |
          mkdir -p artifacts
          ./syft ruggylab-os:license-check -o cyclonedx-json=artifacts/sbom.cyclonedx.json
          ./syft ruggylab-os:license-check -o spdx-json=artifacts/sbom.spdx.json
          test -s artifacts/sbom.cyclonedx.json || { echo "::error::SBOM CycloneDX vide"; exit 1; }
          test -s artifacts/sbom.spdx.json      || { echo "::error::SBOM SPDX vide"; exit 1; }

      # L'inventaire Python ne couvre que les distributions Python. L'image, elle,
      # embarque toute la base système : c'est ce que l'on distribue réellement.
      - name: "9. Auditer le SBOM de l'image (aucune licence indéterminée)"
        run: |
          python scripts/audit_sbom_licenses.py artifacts/sbom.cyclonedx.json             --exceptions docs/governance/SBOM_LICENSE_EXCEPTIONS.json

      # ── 6. Les composants à revue obligatoire restent au registre ─────────
      - name: "10. Registre des décisions de licence"
        run: |
          for marqueur in MANUAL_LICENSE_REVIEW_REQUIRED AGPL_DISTRIBUTION_REVIEW_REQUIRED \n                          BASE_IMAGE_SOURCE_OFFER_REVIEW_REQUIRED "Redis 7.4" "Grafana 11"; do
            grep -q "$marqueur" THIRD_PARTY_NOTICES.md \
              || { echo "::error::'$marqueur' absent du registre des décisions"; exit 1; }
          done
          echo "Composants à revue obligatoire correctement signalés."

      # Artefacts de CI seulement : aucune release, aucun tag.
      - name: Publier les preuves de conformité
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: third-party-evidence
          path: |
            THIRD_PARTY_NOTICES.md
            docs/governance/SBOM_LICENSE_EXCEPTIONS.json
            artifacts/python-licenses.json
            artifacts/sbom.cyclonedx.json
            artifacts/sbom.spdx.json
          if-no-files-found: warn

  codeql:
    name: CodeQL security analysis
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          languages: python

      - name: Autobuild
        uses: github/codeql-action/autobuild@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4

      - name: Analyze code
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          category: "security"

  e2e:
    name: E2E navigateur (Playwright)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Install Playwright (chromium)
        run: |
          npm install -D playwright
          npx playwright install --with-deps chromium

      - name: Start application (SQLite)
        env:
          DATABASE_URL: sqlite:///./e2e.db
          SECRET_KEY: e2e-secret-key-minimum-32-characters-long
          FIRST_SUPERUSER_PASSWORD: E2ePassword123!Secure
          CACHE_BACKEND: memory
        run: |
          alembic upgrade head
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 --log-level warning > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v1/health && break || sleep 1
          done

      - name: Run billing E2E
        env:
          UI_CHECK_BASE_URL: http://127.0.0.1:8000
          FIRST_SUPERUSER_PASSWORD: E2ePassword123!Secure
        run: node scripts/billing_flow_playwright.js

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: e2e-screenshots
          path: artifacts/e2e/
          if-no-files-found: ignore

  docker-stack:
    name: Stack Docker production — cœur sans Grafana
    # Démarre la VRAIE stack de production (image runtime + docker-compose.yml
    # seul, sans fichier dev) et vérifie ce que les tests unitaires ne voient
    # pas : démarrage du conteneur non-root, healthchecks par rôle, seuls 80/443
    # publiés, flux clinique à travers le proxy TLS.
    needs: [test, build-candidate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # L'image n'est PAS reconstruite : on charge l'artefact candidat, et l'on
      # verifie que son identifiant est bien celui que `build-candidate` a
      # publie. Une image differente ferait echouer ce job plutot que produire
      # une preuve portant sur autre chose.
      - name: Load the candidate image
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: candidate-image
          path: artifacts

      - name: Verify the loaded image is the audited candidate
        run: |
          gunzip -c artifacts/candidate-image.tar.gz | docker load
          docker tag ruggylab-os:candidate ruggylab-os:ci
          attendu="${{ needs.build-candidate.outputs.image_id }}"
          obtenu=$(docker image inspect ruggylab-os:ci --format '{{{{.Id}}}}')
          if [ "$obtenu" != "$attendu" ]; then
            echo "::error::image chargee ($obtenu) differente du candidat ($attendu)"
            exit 1
          fi
          sha=$(sha256sum artifacts/candidate-image.tar.gz | cut -d' ' -f1)
          if [ "$sha" != "${{ needs.build-candidate.outputs.archive_sha256 }}" ]; then
            echo "::error::archive alteree : $sha"
            exit 1
          fi
          echo "identite confirmee : $obtenu"

      - name: Create production .env
        run: |
          cat > .env <<'EOF'
          RUGGYLAB_IMAGE=ruggylab-os:ci
          SECRET_KEY=ci-secret-key-minimum-32-characters-long
          FIRST_SUPERUSER_PASSWORD=CiPassword123!Secure
          POSTGRES_PASSWORD=ci_pg_password_123
          DATABASE_URL=postgresql+psycopg://ruggylab:ci_pg_password_123@postgres:5432/ruggylab
          RUGGYLAB_DOMAIN=localhost
          EOF

      - name: Start dependencies and run migrations
        run: |
          docker compose up -d postgres valkey
          docker compose --profile migrate run --rm migrate

      - name: Start full production stack
        run: docker compose up -d

      - name: Wait for app through TLS proxy
        run: |
          for i in $(seq 1 60); do
            curl -skf https://localhost/api/v1/health > /dev/null && break || sleep 2
          done
          curl -skf https://localhost/api/v1/health

      - name: Assert only the proxy publishes ports
        run: |
          docker ps --format '{{.Names}}\t{{.Ports}}'
          leaked=$(docker ps --format '{{.Names}}\t{{.Ports}}' | grep -v proxy | grep -- '->' || true)
          if [ -n "$leaked" ]; then
            echo "::error::Ports publiés hors du proxy :"; echo "$leaked"; exit 1
          fi

      # Grafana est hors du cœur distribué. Ce n'est pas une préférence de
      # déploiement : c'est ce qui fait que RUGGYLAB ne distribue pas d'œuvre
      # AGPL-3.0. Une réintroduction silencieuse dans la stack principale
      # remettrait l'obligation en place sans que personne s'en aperçoive.
      - name: Assert the core stack ships no Grafana
        run: |
          if docker compose ps --services | grep -qx grafana; then
            echo "::error::le service grafana est revenu dans la stack principale"; exit 1
          fi
          if docker image ls --format '{{.Repository}}' | grep -q '^grafana/'; then
            echo "::error::une image Grafana a été téléchargée par le scénario principal"; exit 1
          fi
          if grep -qi grafana .env; then
            echo "::error::le scénario principal exige encore une variable Grafana"; exit 1
          fi
          echo "Cœur RUGGYLAB : aucun service, aucune image, aucune variable Grafana."

      - name: Assert technical paths are blocked at the proxy (§14)
        run: |
          for p in /metrics /docs /openapi.json /redoc; do
            code=$(curl -sk -o /dev/null -w '%{http_code}' "https://localhost$p")
            if [ "$code" != "404" ]; then
              echo "::error::$p renvoie $code via le proxy (attendu 404)"; exit 1
            fi
          done

      - name: Assert Prometheus can still scrape app metrics internally
        run: |
          docker compose exec -T prometheus wget -qO- http://app:8000/metrics | head -1

      - name: Assert automated backup produced a verified dump
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T db-backup sh -c 'ls /backups/ruggylab_pg-*.dump' > /dev/null 2>&1 && break || sleep 2
          done
          docker compose exec -T db-backup sh -c '
            f=$(ls -t /backups/ruggylab_pg-*.dump | head -1) &&
            sha256sum -c "$f.sha256" &&
            cat /backups/last_success.txt'

      - name: Assert role containers are healthy
        run: |
          docker compose ps
          # scheduler et analyzer-gateway utilisent chacun un heartbeat. Les
          # interfaces d'équipement restent désactivées pendant ce smoke test.
          for svc in scheduler analyzer-gateway; do
            for i in $(seq 1 30); do
              st=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q $svc)")
              [ "$st" = "healthy" ] && break || sleep 3
            done
            [ "$st" = "healthy" ] || { echo "::error::$svc = $st"; docker compose logs --tail 50 "$svc"; exit 1; }
          done

      - name: Clinical flow through the TLS proxy
        env:
          UAT_BASE_URL: https://localhost
          UAT_INSECURE_TLS: "1"
          FIRST_SUPERUSER_PASSWORD: CiPassword123!Secure
        run: |
          pip install httpx
          python -m scripts.uat_smoke

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --tail 200

  # ── Overlay de supervision (NON bloquant) ──────────────────────────────────
  # Grafana est une intégration OPTIONNELLE et EXTERNE. Ce job vérifie qu'elle
  # fonctionne pour qui la veut — il ne conditionne pas la qualification du
  # cœur, qui est prouvée par `docker-stack` sans lui. Il n'est donc PAS dans
  # les `needs` de `deploy` : un cœur sain ne doit pas dépendre d'un composant
  # que RUGGYLAB ne distribue pas.
  monitoring-overlay:
    name: Overlay de supervision optionnel (Grafana)
    needs: [test, build-candidate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # L'image n'est PAS reconstruite : on charge l'artefact candidat, et l'on
      # verifie que son identifiant est bien celui que `build-candidate` a
      # publie. Une image differente ferait echouer ce job plutot que produire
      # une preuve portant sur autre chose.
      - name: Load the candidate image
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: candidate-image
          path: artifacts

      - name: Verify the loaded image is the audited candidate
        run: |
          gunzip -c artifacts/candidate-image.tar.gz | docker load
          docker tag ruggylab-os:candidate ruggylab-os:ci
          attendu="${{ needs.build-candidate.outputs.image_id }}"
          obtenu=$(docker image inspect ruggylab-os:ci --format '{{{{.Id}}}}')
          if [ "$obtenu" != "$attendu" ]; then
            echo "::error::image chargee ($obtenu) differente du candidat ($attendu)"
            exit 1
          fi
          sha=$(sha256sum artifacts/candidate-image.tar.gz | cut -d' ' -f1)
          if [ "$sha" != "${{ needs.build-candidate.outputs.archive_sha256 }}" ]; then
            echo "::error::archive alteree : $sha"
            exit 1
          fi
          echo "identite confirmee : $obtenu"

      - name: Create .env with the overlay credentials
        run: |
          cat > .env <<'EOF'
          RUGGYLAB_IMAGE=ruggylab-os:ci
          SECRET_KEY=ci-secret-key-minimum-32-characters-long
          FIRST_SUPERUSER_PASSWORD=CiPassword123!Secure
          POSTGRES_PASSWORD=ci_pg_password_123
          DATABASE_URL=postgresql+psycopg://ruggylab:ci_pg_password_123@postgres:5432/ruggylab
          GRAFANA_PASSWORD=ci_grafana_password_123
          RUGGYLAB_DOMAIN=localhost
          EOF

      - name: Start the core stack plus the monitoring overlay
        run: |
          docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d postgres valkey
          docker compose -f docker-compose.yml -f docker-compose.monitoring.yml --profile migrate run --rm migrate
          docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d

      - name: Wait for Grafana to become healthy
        run: |
          for i in $(seq 1 40); do
            st=$(docker inspect -f '{{.State.Health.Status}}'                  "$(docker compose -f docker-compose.yml -f docker-compose.monitoring.yml ps -q grafana)" 2>/dev/null || echo starting)
            [ "$st" = "healthy" ] && break || sleep 3
          done
          [ "$st" = "healthy" ] || {
            echo "::error::Grafana = $st"
            docker compose -f docker-compose.yml -f docker-compose.monitoring.yml logs --tail 80 grafana
            exit 1
          }

      - name: Assert the Prometheus datasource is provisioned
        run: |
          reponse=$(docker compose -f docker-compose.yml -f docker-compose.monitoring.yml exec -T grafana             wget -qO- --header "Content-Type: application/json"             "http://admin:ci_grafana_password_123@localhost:3000/api/datasources")
          echo "$reponse"
          echo "$reponse" | grep -q '"type":"prometheus"'             || { echo "::error::datasource Prometheus absente"; exit 1; }

      - name: Assert the RUGGYLAB dashboards are loaded
        run: |
          reponse=$(docker compose -f docker-compose.yml -f docker-compose.monitoring.yml exec -T grafana             wget -qO- "http://admin:ci_grafana_password_123@localhost:3000/api/search?type=dash-db")
          echo "$reponse"
          echo "$reponse" | grep -q '"uid"'             || { echo "::error::aucun tableau de bord chargé"; exit 1; }

      # Le vrai test de l'externalisation : retirer Grafana ne doit rien casser.
      - name: Remove Grafana and assert RUGGYLAB is unaffected
        run: |
          docker compose -f docker-compose.yml -f docker-compose.monitoring.yml rm -sf grafana
          docker volume rm -f "$(docker volume ls -q | grep grafana_data | head -1)" || true
          curl -skf https://localhost/api/v1/health
          docker compose -f docker-compose.yml exec -T prometheus wget -qO- http://app:8000/metrics | head -1
          echo "RUGGYLAB reste sain sans Grafana."

      - name: Compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml logs --tail 200

  # ── Preuves de source correspondante (base Debian) ─────────────────────────
  # Distribuer une image, c'est distribuer les binaires qu'elle contient. Une
  # partie de la base Debian est sous GPL/LGPL. Ce job produit les PREUVES —
  # quels paquets, quelles versions, quelles sources, disponibles où — sans rien
  # conclure juridiquement. Il échoue si la NOTICE est incomplète dans l'image,
  # ce qui se constate sans avis juridique.
  debian-source-evidence:
    name: Preuves de source correspondante (base Debian)
    needs: [test, build-candidate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      # L'image n'est PAS reconstruite : on charge l'artefact candidat, et l'on
      # verifie que son identifiant est bien celui que `build-candidate` a
      # publie. Une image differente ferait echouer ce job plutot que produire
      # une preuve portant sur autre chose.
      - name: Load the candidate image
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: candidate-image
          path: artifacts

      - name: Verify the loaded image is the audited candidate
        run: |
          gunzip -c artifacts/candidate-image.tar.gz | docker load
          docker tag ruggylab-os:candidate ruggylab-os:source-evidence
          attendu="${{ needs.build-candidate.outputs.image_id }}"
          obtenu=$(docker image inspect ruggylab-os:source-evidence --format '{{{{.Id}}}}')
          if [ "$obtenu" != "$attendu" ]; then
            echo "::error::image chargee ($obtenu) differente du candidat ($attendu)"
            exit 1
          fi
          sha=$(sha256sum artifacts/candidate-image.tar.gz | cut -d' ' -f1)
          if [ "$sha" != "${{ needs.build-candidate.outputs.archive_sha256 }}" ]; then
            echo "::error::archive alteree : $sha"
            exit 1
          fi
          echo "identite confirmee : $obtenu"

      # La base est référencée par digest dans le Dockerfile. Si le digest
      # bougeait, ce serait un changement délibéré, pas une dérive silencieuse.
      - name: Assert the base image is pinned by digest
        run: |
          if ! grep -qE '^FROM python:[0-9]+\.[0-9]+\.[0-9]+-slim[a-z-]*@sha256:[0-9a-f]{64}' Dockerfile; then
            echo "::error::la base Python n'est pas épinglée par version exacte ET digest"
            grep -n '^FROM' Dockerfile
            exit 1
          fi
          grep -c '^FROM python:.*@sha256:' Dockerfile

      - name: Generate the Debian source and licence manifests
        run: |
          python scripts/debian_source_manifest.py ruggylab-os:source-evidence             --out artifacts             --exceptions docs/governance/DEBIAN_NOTICE_EXCEPTIONS.json             --check-availability

      # Une URL écrite dans un manifeste ne prouve rien tant que personne ne
      # l'a ouverte. `--check-availability` l'ouvre ; on vérifie ici qu'aucune
      # source n'est restée introuvable.
      # Un 200 sur la page d'un paquet ne prouve rien sur ses FICHIERS : la page
      # peut exister sans que l'archive source soit récupérable. Le générateur
      # descend donc jusqu'au fichier ; on vérifie ici qu'aucun n'est resté sans
      # empreinte ni sans réponse. Une panne externe bloque et fait relancer le
      # workflow — elle ne doit pas produire une preuve verte.
      - name: Assert every corresponding source file is reachable and hashed
        run: |
          python - <<'PY'
          import json, pathlib, sys

          charge = json.loads(
              pathlib.Path("artifacts/debian-source-packages.json").read_text(encoding="utf-8")
          )
          provenance = charge["provenance"]
          sources = charge["source_packages"]
          fichiers = [f for s in sources for f in s["source_files"]]

          print(f"plateforme  : {provenance['platform']}")
          print(f"base        : {provenance['base_image_reference']}")
          print(f"commit      : {provenance['git_sha'][:12]}")
          print(f"{len(sources)} paquets sources, {len(fichiers)} fichiers sources")

          bloquants = []
          for source in sources:
              if source["source_availability"] != "verified":
                  bloquants.append(
                      f"{source['source_package']} {source['source_version']}"
                      f" -> {source['source_availability']}"
                  )
              if source["source_files_resolution"] != "resolved":
                  bloquants.append(f"{source['source_package']} -> fichiers non résolus")
          for fichier in fichiers:
              if fichier["availability"] != "verified":
                  bloquants.append(f"{fichier['name']} -> {fichier['availability']}")
              if not fichier.get("sha256"):
                  bloquants.append(f"{fichier['name']} -> aucun sha256")

          for message in bloquants:
              print(f"::error::source non prouvée : {message}")
          if bloquants:
              sys.exit(1)
          print("Toutes les sources correspondantes sont résolues, joignables et empreintées.")
          PY

      - name: Publier les preuves de source correspondante
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: debian-source-evidence
          path: |
            artifacts/debian-binary-packages.json
            artifacts/debian-source-packages.json
            artifacts/debian-license-manifest.json
            docs/compliance/SOURCE_COMPLIANCE.md
            docs/governance/DEBIAN_NOTICE_EXCEPTIONS.json
          if-no-files-found: error

  # ── Garde de tag (avant toute publication) ─────────────────────────────────
  # Placée AVANT `deploy` : un tag malformé ne doit pas même déclencher une
  # construction d'image. Deux contrôles.
  #
  # 1. FORME. Seuls `vX.Y.Z`, `vX.Y.Z-alpha.N`, `-beta.N`, `-rc.N` sont admis.
  #    Sans cela, `v0.8` ou `v0.8.0-beta` (sans numéro) auraient produit une
  #    image et une release aux identifiants ambigus.
  #
  # 2. GOUVERNANCE. Tant que `docs/governance/CLINICAL_STATUS` vaut
  #    REAL_DATA_NO_GO, un tag STABLE (sans suffixe) est refusé : publier une
  #    version présentée comme stable contredirait la décision clinique en
  #    vigueur. Le statut vit dans un fichier versionné, et non en dur ici :
  #    lever le NO-GO devient une modification tracée et relue, pas un
  #    contournement de CI.
  tag-guard:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
      make_latest: ${{ steps.check.outputs.make_latest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Contrôler la forme du tag et le statut de gouvernance
        id: check
        run: |
          # Le job tourne sur TOUS les déclencheurs, pour rester une dépendance
          # satisfaite de `deploy` (un `needs` sauté sauterait aussi `deploy`).
          # Hors tag, il n'y a simplement rien à valider.
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Déclenchement hors tag : aucune version à valider."
            exit 0
          fi
          tag="${GITHUB_REF_NAME}"

          # ── Gate de DISTRIBUTION, distinct du gate clinique ────────────────
          # REAL_DATA_NO_GO interdit l'usage clinique réel ; il n'interdit pas
          # de publier une image d'évaluation. DISTRIBUTION_NO_GO interdit la
          # publication elle-même : image, GitHub Release, remise à un tiers.
          # Deux questions distinctes, deux verrous distincts — un seul fichier
          # laisserait croire que lever l'un lève l'autre.
          #
          # Ce contrôle passe AVANT l'examen de la forme : une pré-version
          # parfaitement formée est refusée elle aussi tant que la distribution
          # n'est pas autorisée.
          distribution="$(tr -d '[:space:]' < docs/governance/DISTRIBUTION_STATUS)"
          echo "statut de distribution : $distribution"
          if [[ "$distribution" != "CONTROLLED_EVALUATION_DISTRIBUTION_GO" ]]; then
            echo "::error::Tag '$tag' refusé : DISTRIBUTION_STATUS = $distribution."
            echo "::error::Aucune version ne peut être publiée tant que la distribution n'est pas"
            echo "::error::autorisée, y compris une pré-version correctement formée."
            echo "::error::Lever ce verrou exige une PR distincte et les preuves listées dans"
            echo "::error::docs/governance/DISTRIBUTION_STATUS."
            exit 1
          fi
          stable='^v[0-9]+\.[0-9]+\.[0-9]+$'
          pre='^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$'

          if [[ "$tag" =~ $pre ]]; then
            echo "prerelease=true"   >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
            echo "$tag : pré-version valide -> prerelease=true, make_latest=false"
          elif [[ "$tag" =~ $stable ]]; then
            statut="$(tr -d '[:space:]' < docs/governance/CLINICAL_STATUS)"
            echo "statut de gouvernance : $statut"
            if [[ "$statut" == "REAL_DATA_NO_GO" ]]; then
              echo "::error::Tag stable '$tag' refusé : le statut clinique est REAL_DATA_NO_GO."
              echo "::error::Utiliser une pré-version (-alpha.N / -beta.N / -rc.N), ou faire lever"
              echo "::error::le NO-GO par une décision signée modifiant docs/governance/CLINICAL_STATUS."
              exit 1
            fi
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
            echo "$tag : version stable -> prerelease=false, make_latest=true"
          else
            echo "::error::Tag '$tag' malformé. Formes admises : vX.Y.Z, vX.Y.Z-alpha.N, vX.Y.Z-beta.N, vX.Y.Z-rc.N."
            exit 1
          fi

  deploy:
    name: Build and publish Docker image
    # Déploiement uniquement sur tag de version (vX.Y.Z) ou déclenchement manuel —
    # pas sur chaque commit poussé sur main.
    # `workflow_dispatch` retiré : il permettait de publier une image sur GHCR
    # d'un simple clic, sans tag, donc sans passer par `tag-guard` — le gate de
    # distribution aurait été contournable par l'interface. `deploy` ne
    # s'exécute plus QUE sur un tag, et un tag n'existe que si `tag-guard`
    # l'accepte. Pour construire et tester sans publier, la CI de PR le fait
    # déjà à chaque poussée.
    if: startsWith(github.ref, 'refs/tags/v')
    # Tous bloquants : aucune image n'est publiée si l'un de ces contrôles
    # échoue — parcours navigateur (e2e), flux clinique PostgreSQL
    # (test-postgres), stack Docker de production (docker-stack), analyse CodeQL,
    # et **restauration de sauvegarde** (backup-restore). Publier une image dont
    # on n'a pas démontré que la base se restaure reviendrait à livrer sans filet.
    # `monitoring-overlay` n'y figure PAS, et ne doit pas y figurer : Grafana
    # est une intégration optionnelle et externe, un cœur sain ne dépend pas
    # d'un composant que RUGGYLAB ne distribue pas.
    #
    # Les DEUX gates de conformité y figurent, et c'est le point de cette PR :
    #   `debian-source-evidence` — distribuer l'image sans savoir quels paquets
    #     copyleft elle contient ni où leurs sources se trouvent, c'est
    #     distribuer sans preuve ;
    #   `license-compliance`     — la distribuer sans son texte de licence ni
    #     les notices de ses composants ne satisfait aucune obligation.
    # Perdre l'un des deux lors d'une fusion rouvrirait le trou qu'il ferme :
    # `tests/test_release_pipeline.py` refuse toute liste qui s'en écarte.
    needs:
      - test
      - test-postgres
      - codeql
      - e2e
      - docker-stack
      - backup-restore
      - build-candidate
      - debian-source-evidence
      - license-compliance
      - tag-guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # L'image n'est PAS reconstruite ici. Reconstruire publierait un artefact
      # que ni le SBOM, ni les preuves Debian, ni la qualification Docker n'ont
      # examiné : deux constructions du même Dockerfile peuvent différer, et les
      # preuves décriraient alors une image qui n'est pas celle qu'on livre.
      # On pousse EXACTEMENT l'archive que `build-candidate` a produite et que
      # les gates ont validée.
      - name: Load the audited candidate image
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: candidate-image
          path: artifacts

      - name: Verify the artefact is the one the gates audited
        run: |
          sha=$(sha256sum artifacts/candidate-image.tar.gz | cut -d' ' -f1)
          attendu_sha="${{ needs.build-candidate.outputs.archive_sha256 }}"
          if [ "$sha" != "$attendu_sha" ]; then
            echo "::error::archive alterée depuis sa construction : $sha != $attendu_sha"
            exit 1
          fi
          gunzip -c artifacts/candidate-image.tar.gz | docker load
          image_id=$(docker image inspect ruggylab-os:candidate --format '{{.Id}}')
          attendu_id="${{ needs.build-candidate.outputs.image_id }}"
          if [ "$image_id" != "$attendu_id" ]; then
            echo "::error::image chargée ($image_id) différente du candidat ($attendu_id)"
            exit 1
          fi
          echo "artefact confirmé : $image_id"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Chemin aligné sur docker-compose (ghcr.io/<owner>/<repo>:<tag>).
      # `deploy` ne s'exécute que sur un tag, et un tag n'existe que si
      # `tag-guard` l'a accepté — donc que si DISTRIBUTION_STATUS l'autorise.
      - name: Push the audited image
        id: build
        run: |
          reference="ghcr.io/${GITHUB_REPOSITORY}"
          docker tag ruggylab-os:candidate "${reference}:${GITHUB_SHA}"
          docker tag ruggylab-os:candidate "${reference}:${GITHUB_REF_NAME}"
          docker push "${reference}:${GITHUB_SHA}"
          docker push "${reference}:${GITHUB_REF_NAME}"
          format='{{index .RepoDigests 0}}'
          digest=$(docker image inspect "${reference}:${GITHUB_REF_NAME}" --format "$format" | cut -d'@' -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "digest publié : $digest"

      # La provenance relie les trois identifiants : ce qui a été construit, ce
      # qui a été audité, ce qui a été publié. Sans ce lien écrit, « l'image
      # auditée » et « l'image publiée » ne sont que deux affirmations.
      - name: Record the artefact identity chain
        run: |
          mkdir -p artifacts
          {
            echo "# Chaîne d'identité de l'artefact"
            echo
            echo "| Étape | Identifiant |"
            echo "| --- | --- |"
            echo "| Image construite (image ID) | \`${{ needs.build-candidate.outputs.image_id }}\` |"
            echo "| Archive auditée (SHA-256)   | \`${{ needs.build-candidate.outputs.archive_sha256 }}\` |"
            echo "| Image publiée (digest OCI)  | \`${{ steps.build.outputs.digest }}\` |"
            echo "| Commit                      | \`${GITHUB_SHA}\` |"
            echo "| Tag                         | \`${GITHUB_REF_NAME}\` |"
            echo
            echo "Les gates \`docker-stack\`, \`license-compliance\` et"
            echo "\`debian-source-evidence\` ont examiné l'image portant cet image ID."
            echo "Aucune reconstruction n'a eu lieu entre l'audit et la publication."
          } > artifacts/ARTIFACT_IDENTITY.md
          cat artifacts/ARTIFACT_IDENTITY.md

      - name: Publier la chaîne d'identité
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: artifact-identity
          path: artifacts/ARTIFACT_IDENTITY.md
          if-no-files-found: error

      - name: Récapitulatif de l'image publiée
        run: |
          echo "digest immuable : ${{ steps.build.outputs.digest }}"
          {
            echo "### Image publiée"
            echo ""
            echo "- Référence : \`ghcr.io/${{ github.repository }}:${{ github.ref_name }}\`"
            echo "- Digest : \`${{ steps.build.outputs.digest }}\`"
            echo "- Tag \`latest\` : **non appliqué**"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Publication de la GitHub Release (dernier maillon) ─────────────────────
  # La Release était auparavant créée par un workflow `release.yml` distinct,
  # déclenché par le même tag mais SANS aucune dépendance : elle pouvait donc
  # naître avant — ou malgré — l'échec des tests, et annoncer une version qui
  # n'avait rien prouvé. Elle est désormais le dernier maillon de la CI :
  # `needs: [deploy]`, qui dépend lui-même de tous les jobs bloquants.
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    # `tag-guard` est la SOURCE UNIQUE de la nature de la version : dupliquer la
    # règle ici la ferait diverger un jour, et c'est précisément la classification
    # prerelease/stable qu'il ne faut pas se tromper.
    needs: [deploy, tag-guard, license-compliance, debian-source-evidence]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # Les SBOM ne sont pas régénérés ici : on rattache EXACTEMENT ceux que le
      # job de conformité a produits et qui ont fait passer les gates. Les
      # reconstruire ici publierait un inventaire que rien n'a vérifié.
      - name: Récupérer les preuves de conformité de licence
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: third-party-evidence
          path: artifacts-evidence

      - name: Récupérer les preuves de source correspondante
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: debian-source-evidence
          path: artifacts-debian

      - name: Récupérer la chaîne d'identité de l'artefact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: artifact-identity
          path: artifacts-identity

      # Le digest est la seule référence immuable de l'image : un tag peut être
      # redirigé, un digest non. Il est écrit dans un fichier joint à la Release
      # pour rester lisible même quand les notes sont regénérées.
      - name: Composer la provenance de la version
        env:
          DIGEST: ${{ needs.deploy.outputs.digest }}
        run: |
          mkdir -p artifacts
          # Rien n'est REGENERE ici : on rattache exactement les pieces que les
          # gates ont produites et validees. Les reconstruire publierait des
          # preuves que rien n'a verifiees.
          cp artifacts-evidence/artifacts/sbom.cyclonedx.json   artifacts/
          cp artifacts-evidence/artifacts/sbom.spdx.json        artifacts/
          cp artifacts-evidence/artifacts/python-licenses.json  artifacts/
          cp artifacts-debian/artifacts/debian-binary-packages.json  artifacts/
          cp artifacts-debian/artifacts/debian-source-packages.json  artifacts/
          cp artifacts-debian/artifacts/debian-license-manifest.json artifacts/
          cp artifacts-debian/docs/compliance/SOURCE_COMPLIANCE.md   artifacts/
          cp artifacts-debian/docs/governance/DEBIAN_NOTICE_EXCEPTIONS.json artifacts/
          cp artifacts-identity/ARTIFACT_IDENTITY.md artifacts/
          {
            echo "# Provenance — ${GITHUB_REF_NAME}"
            echo
            echo "- Image      : \`ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}\`"
            echo "- Digest     : \`${DIGEST}\`"
            echo "- Commit     : \`${GITHUB_SHA}\`"
            echo "- Licence    : \`LicenseRef-RuggyLab-Evaluation-1.0\`"
            echo "- Statut     : \`$(cat docs/governance/CLINICAL_STATUS)\`"
            echo
            echo "Composants tiers en revue de licence obligatoire : voir"
            echo "\`THIRD_PARTY_NOTICES.md\` §6. Ils bloquent toute distribution externe."
          } > artifacts/RELEASE_PROVENANCE.md
          cat artifacts/RELEASE_PROVENANCE.md

      # L'avertissement est préfixé aux notes générées : l'API GitHub place le
      # `body` fourni AVANT les notes qu'elle génère.
      - name: Composer l'avertissement de pré-version
        id: body
        if: needs.tag-guard.outputs.prerelease == 'true'
        run: |
          {
            echo 'text<<RELEASE_BODY_EOF'
            echo '> ⚠️ BÊTA TECHNIQUE — REAL_DATA_NO_GO'
            echo '>'
            echo '> Cette version est destinée exclusivement au développement, à la qualification'
            echo '> technique et aux essais sur données fictives ou synthétiques.'
            echo '> Elle ne constitue pas une autorisation d'"'"'utilisation clinique réelle.'
            echo '> La synchronisation CSA et les interfaces automates restent désactivées par défaut.'
            echo ''
            echo "Image : \`ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME}\`"
            echo "Digest : \`${{ needs.deploy.outputs.digest }}\`"
            echo 'RELEASE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body: ${{ steps.body.outputs.text }}
          generate_release_notes: true
          prerelease: ${{ needs.tag-guard.outputs.prerelease }}
          make_latest: ${{ needs.tag-guard.outputs.make_latest }}
          files: |
            CHANGELOG.md
            LICENSE.md
            THIRD_PARTY_NOTICES.md
            artifacts/sbom.cyclonedx.json
            artifacts/sbom.spdx.json
            artifacts/python-licenses.json
            artifacts/RELEASE_PROVENANCE.md
            artifacts/ARTIFACT_IDENTITY.md
            artifacts/debian-binary-packages.json
            artifacts/debian-source-packages.json
            artifacts/debian-license-manifest.json
            artifacts/SOURCE_COMPLIANCE.md
            artifacts/DEBIAN_NOTICE_EXCEPTIONS.json
          # Strict : une Release publiée SANS son SBOM ni son texte de licence
          # serait une distribution sans preuve de conformité. Mieux vaut
          # échouer que publier une version dont on ne peut pas dire ce
          # qu'elle contient.
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
