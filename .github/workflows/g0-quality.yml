# Baseline de qualité mesurable — G0, lot C (preuves 7 et 8).
#
# Ce workflow MESURE. Il ne juge pas, ne publie rien, ne décide de rien : aucun
# seuil de couverture, aucun objectif de latence, aucune image, aucun tag,
# aucun statut de gouvernance modifié. Un chiffre défavorable n'y fait échouer
# aucun job — seule une **mesure invalide** le fait, c'est-à-dire une mesure
# dont on ne pourrait rien conclure.
#
# POURQUOI UN FICHIER SÉPARÉ DE `ci.yml`
# --------------------------------------
# Le lot B (sécurité) modifie `ci.yml` en parallèle. Deux lots qui éditent le
# même fichier produisent un conflit de fusion sur des centaines de lignes, et
# un conflit qu'on résout à la main sur un pipeline est une occasion d'y perdre
# un contrôle sans s'en apercevoir. Les jobs du lot C vivent donc ici, et
# `ci.yml` n'est pas touché.
#
# POURQUOI LES ARTEFACTS NE SONT PAS VERSIONNÉS
# ---------------------------------------------
# Le lot A versionne ses artefacts et les compare octet à octet : un inventaire
# se dérive du code, donc une divergence est une erreur. Une couverture et une
# latence, elles, s'observent — deux exécutions de la même suite sur la même
# révision ne donnent pas les mêmes chiffres. Un fichier versionné ne pourrait
# jamais être contredit par une nouvelle mesure, et deviendrait une preuve que
# rien ne vérifie. Ils sont donc régénérés à chaque exécution, contrôlés, et
# publiés comme artefacts de CI ; leurs valeurs sont reprises dans
# `docs/g0/COVERAGE.md` et `docs/g0/PERFORMANCE.md` avec l'identifiant de
# l'exécution qui les a produites.
name: G0 Quality baseline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Lecture seule, et rien de plus. Ce workflow ne pousse aucune image et ne crée
# aucune release : les droits d'écriture sur les paquets ou sur le dépôt
# n'auraient ici aucun usage légitime, et un job qui mesure ne doit rien
# pouvoir publier.
permissions:
  contents: read

jobs:
  # ── Preuve 7 — couverture lignes et branches ───────────────────────────────
  # La mesure combine tout ce qui peut être exécuté dans un processus Python
  # instrumenté :
  #   1. la suite complète (unitaire, services, routes, sécurité, schémas) ;
  #   2. les tests adossés à PostgreSQL, rejoués contre une vraie base migrée ;
  #   3. le flux clinique de bout en bout, l'application elle-même étant lancée
  #      sous `coverage run`.
  #
  # Le point 3 est ce qui distingue cette mesure d'une mesure de complaisance :
  # sans lui, tout le code réellement traversé par un parcours patient
  # apparaîtrait non couvert, ou — pire — on serait tenté de l'affirmer couvert
  # parce qu'un test de bout en bout existe ailleurs. Un parcours qui ne passe
  # pas par un interpréteur instrumenté N'EST PAS mesuré, et le document le dit.
  coverage-baseline:
    name: G0 — Coverage baseline
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ruggylab
          POSTGRES_PASSWORD: ruggylab_g0_cov
          POSTGRES_DB: ruggylab_g0_cov
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      PG_URL: postgresql+psycopg://ruggylab:ruggylab_g0_cov@localhost:5432/ruggylab_g0_cov
      SECRET_KEY: ci-secret-key-minimum-32-characters-long
      FIRST_SUPERUSER_PASSWORD: CiPassword123!Secure

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Record the measuring tools
        run: |
          python -m coverage --version
          python -m pytest --version
          pip show pytest-cov | head -2
          python -m coverage debug config | grep -E 'branch|source|namespace|relative'

      # 1. Suite complète. Les rapports par suite sont écrits dans un
      #    répertoire temporaire : les artefacts définitifs viennent des données
      #    COMBINÉES, et écraser l'un par l'autre publierait une mesure
      #    partielle sous le nom de la mesure complète.
      - name: "1. Suite complete sous instrumentation"
        run: |
          set -o pipefail
          python -m pytest \
            --cov=app --cov-branch \
            --cov-report=xml:"$RUNNER_TEMP/coverage-suite.xml" \
            --cov-report=json:"$RUNNER_TEMP/coverage-suite.json" \
            --cov-report=term-missing \
            | tee "$RUNNER_TEMP/coverage-term-missing.txt"
          mv .coverage .coverage.suite

      - name: Apply Alembic migrations
        env:
          DATABASE_URL: ${{ env.PG_URL }}
        run: alembic upgrade head

      # 2. Les tests adossés à PostgreSQL. Ce sont exactement ceux que `ci.yml`
      #    exécute dans son job `test-postgres` : la liste n'est pas choisie
      #    ici, elle est reprise, faute de quoi on pourrait la restreindre pour
      #    embellir le résultat.
      - name: "2. Tests PostgreSQL sous instrumentation"
        env:
          DATABASE_URL: ${{ env.PG_URL }}
          TESTING: "true"
        run: |
          python -m pytest \
            --cov=app --cov-branch --cov-report=term \
            tests/test_clinical_safety_postgres.py \
            tests/test_analyzer_idempotency_r6_postgres.py \
            tests/test_lab_numbering_r5_postgres.py \
            tests/test_preanalytic_cancelled_sample_postgres.py \
            tests/test_quality_transaction_postgres.py \
            tests/test_finance_transaction_postgres.py \
            tests/test_imaging_transaction_postgres.py \
            tests/test_auth_session_postgres.py \
            tests/test_equipment_registry_postgres.py
          mv .coverage .coverage.postgres

      # 3. Flux clinique de bout en bout, application instrumentée. Démarrage,
      #    parcours et arrêt dans une SEULE étape : l'arrêt gracieux (SIGINT)
      #    est ce qui fait écrire les données de couverture, et un arrêt réparti
      #    sur deux étapes les perdrait sans bruit.
      - name: "3. Flux clinique E2E, application sous coverage"
        env:
          DATABASE_URL: ${{ env.PG_URL }}
          CACHE_BACKEND: memory
          ENABLE_DH36_LISTENER: "false"
          UAT_BASE_URL: http://127.0.0.1:8000
        run: |
          python -m coverage run --parallel-mode --branch --source=app \
            -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --log-level warning \
            > uvicorn-g0.log 2>&1 &
          pid=$!
          pret=0
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/api/v1/health > /dev/null; then pret=1; break; fi
            sleep 1
          done
          if [ "$pret" != "1" ]; then
            echo "::error::l'application instrumentee n'a pas demarre"
            cat uvicorn-g0.log
            kill -9 "$pid" || true
            exit 1
          fi
          python -m scripts.uat_smoke
          kill -INT "$pid"
          for _ in $(seq 1 60); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo "::error::l'application ne s'est pas arretee : donnees de couverture perdues"
            kill -9 "$pid" || true
            exit 1
          fi
          ls -a | grep -c '^\.coverage' || true

      # 4. Combinaison. Les trois sources deviennent une seule mesure. Sans
      #    cela, on publierait la plus flatteuse des trois.
      - name: "4. Combiner les processus instrumentes"
        run: |
          echo "Fichiers de donnees avant combinaison :"
          ls -a | grep '^\.coverage' || true
          python -m coverage combine
          mkdir -p artifacts/g0
          python -m coverage xml -o artifacts/g0/coverage.xml
          python -m coverage json -o artifacts/g0/coverage.json
          python -m coverage report --show-missing \
            > "$RUNNER_TEMP/coverage-combined-term-missing.txt" || true
          tail -30 "$RUNNER_TEMP/coverage-combined-term-missing.txt"

      - name: "5. Resume structure de la couverture"
        run: python scripts/g0_coverage_summary.py --generate --print-summary

      # 6. Contrôle de validité. Il ne juge AUCUN pourcentage. Il refuse une
      #    mesure dont on ne pourrait rien conclure : branches non mesurées, XML
      #    incomplet, périmètre réduit, regroupement critique absent.
      - name: "6. Refuser une mesure de couverture invalide"
        run: python scripts/g0_coverage_summary.py --check

      # 7. Non-vacuité. Les contrôles ci-dessus valent ce que valent leurs
      #    mutations : chaque test de `test_g0_quality_baseline.py` applique une
      #    altération connue et exige un refus, avec à chaque fois un témoin qui
      #    exige l'inverse sur la mesure intacte.
      - name: "7. Rejouer les mutations (non-vacuite des controles)"
        run: python -m pytest -q tests/test_g0_quality_baseline.py

      - name: "8. Aucun seuil n'a ete introduit"
        run: |
          # Le motif est une EXPRESSION REGULIERE : le texte fail[_-]under
          # ecrit ici ne se correspond pas a lui-meme, et cette etape ne se
          # declenche donc pas sur sa propre ligne.
          if grep -rnE "fail[_-]under" pyproject.toml scripts/g0_coverage_summary.py \
               .github/workflows/g0-quality.yml; then
            echo "::error::un seuil de couverture a ete introduit — G0 constate, il ne juge pas"
            exit 1
          fi
          echo "Aucun seuil de couverture. Le chiffre est publie tel qu'il sort."

      - name: Confirm the governance statuses are unchanged
        run: |
          clinique=$(tr -d '[:space:]' < docs/governance/CLINICAL_STATUS)
          distribution=$(tr -d '[:space:]' < docs/governance/DISTRIBUTION_STATUS)
          echo "CLINICAL_STATUS=$clinique"
          echo "DISTRIBUTION_STATUS=$distribution"
          test "$clinique" = "REAL_DATA_NO_GO" || { echo "::error::CLINICAL_STATUS modifié"; exit 1; }
          test "$distribution" = "DISTRIBUTION_NO_GO" || { echo "::error::DISTRIBUTION_STATUS modifié"; exit 1; }

      # Publié même en échec : c'est précisément quand la mesure est refusée
      # qu'on a besoin de lire ce qui a été produit.
      - name: Publish the coverage baseline
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: g0-coverage-baseline
          path: |
            artifacts/g0/coverage.xml
            artifacts/g0/coverage.json
            artifacts/g0/coverage-summary.json
            ${{ runner.temp }}/coverage-suite.xml
            ${{ runner.temp }}/coverage-suite.json
            ${{ runner.temp }}/coverage-term-missing.txt
            ${{ runner.temp }}/coverage-combined-term-missing.txt
          if-no-files-found: error
          retention-days: 90

      - name: Uvicorn log on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: g0-coverage-uvicorn-log
          path: uvicorn-g0.log
          if-no-files-found: ignore

  # ── Preuve 8 — baseline de performance ────────────────────────────────────
  # Stack Docker réelle : proxy TLS, application, scheduler, PostgreSQL,
  # Valkey, Prometheus. Grafana n'est pas requis et n'est pas démarré. CSA et
  # interfaces d'automates restent désactivés, et le script le VÉRIFIE en
  # interrogeant le processus applicatif — une variable d'environnement absente
  # ne prouve rien.
  #
  # Le scénario n'est pas réduit pour tenir en CI : quatre niveaux de
  # concurrence, trois répétitions, warm-up, quatorze pas de lecture et
  # d'écriture. Ce qui est borné, c'est le nombre d'itérations par utilisateur
  # virtuel (5 après 2 de chauffe) — ce choix est écrit dans
  # `docs/g0/PERFORMANCE.md`, avec ce qu'il coûte.
  performance-baseline:
    name: G0 — Performance baseline
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      COMPOSE_PROJECT_NAME: ruggylab_g0_quality
      RUGGYLAB_IMAGE: ruggylab-os:g0
      G0_ADMIN_USER: admin
      G0_ADMIN_PASSWORD: CiPassword123!Secure

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install the measuring client
        run: |
          python -m pip install --upgrade pip
          pip install httpx==0.28.1 psutil==7.2.2

      # L'image est construite ICI, et son identité est enregistrée : une
      # baseline qui ne dirait pas quelle image elle a mesurée ne se compare à
      # rien. `gzip -n` supprime l'horodatage de l'archive, sans quoi son
      # empreinte changerait à chaque exécution sans que l'image change.
      - name: Build the measured image and record its identity
        run: |
          docker build -t "$RUGGYLAB_IMAGE" .
          docker image inspect "$RUGGYLAB_IMAGE" --format '{{.Id}}' | tee image-id.txt
          docker save "$RUGGYLAB_IMAGE" | gzip -n > "$RUNNER_TEMP/g0-image.tar.gz"
          sha256sum "$RUNNER_TEMP/g0-image.tar.gz" | cut -d' ' -f1 > image-archive-sha256.txt
          cat image-archive-sha256.txt

      - name: Create the measurement .env
        run: |
          cat > .env <<'EOF'
          RUGGYLAB_IMAGE=ruggylab-os:g0
          SECRET_KEY=ci-secret-key-minimum-32-characters-long
          FIRST_SUPERUSER_PASSWORD=CiPassword123!Secure
          POSTGRES_PASSWORD=g0_perf_pg_password
          DATABASE_URL=postgresql+psycopg://ruggylab:g0_perf_pg_password@postgres:5432/ruggylab
          RUGGYLAB_DOMAIN=localhost
          EOF

      - name: Start dependencies and run migrations
        run: |
          docker compose up -d postgres valkey
          docker compose --profile migrate run --rm migrate

      # La surcharge de mesure désactive les DEUX limiteurs de débit, et rien
      # d'autre. Sans elle, au-delà de la centième requête l'application répond
      # 429 : on ne mesurerait plus le laboratoire, on mesurerait le limiteur.
      # Ce que cela retire de la mesure est écrit dans PERFORMANCE.md et dans
      # `perf-baseline.json`.
      - name: Start the full stack with the measurement overlay
        run: |
          docker compose -f docker-compose.yml -f scripts/g0_perf_overlay.yml up -d
          docker compose ps

      - name: Wait for the application through the TLS proxy
        run: |
          for _ in $(seq 1 60); do
            curl -skf https://localhost/api/v1/health > /dev/null && break || sleep 2
          done
          curl -skf https://localhost/api/v1/health

      - name: Assert Grafana is absent from the measured stack
        run: |
          if docker compose ps --services | grep -qx grafana; then
            echo "::error::grafana demarre dans la stack de mesure"; exit 1
          fi
          echo "Grafana non requis, non demarre."

      # Le scénario complet. Aucun réessai, aucune erreur exclue : un taux
      # d'erreur est un RÉSULTAT, transmis au lot D.
      - name: Run the performance baseline
        run: |
          python scripts/g0_perf_baseline.py --run \
            --base-url https://localhost --insecure \
            --admin-user "$G0_ADMIN_USER" --admin-password "$G0_ADMIN_PASSWORD" \
            --concurrency 1,3,5,10 \
            --repetitions 3 --iterations 5 --warmup 2 --min-samples 10 \
            --seed 20260909 \
            --image "$RUGGYLAB_IMAGE" \
            --image-archive-sha256 "$(cat image-archive-sha256.txt)" \
            --runner "github-actions/ubuntu-latest" \
            --git-commit "${GITHUB_SHA}"

      # Second contrôle, sur le FICHIER cette fois. Le premier porte sur l'objet
      # en mémoire ; celui-ci relit ce qui a été écrit, et vérifie en plus que
      # la provenance décrit bien cette mesure — schéma, complétude, cohérence.
      # Jamais une comparaison de latences : elles varient par nature.
      - name: Refuse an invalid measurement or an inconsistent provenance
        run: |
          python scripts/g0_perf_baseline.py \
            --validate artifacts/g0/perf-baseline.json \
            --provenance artifacts/g0/perf-provenance.json

      - name: Publish the measured results (constat, jamais verdict)
        run: |
          python - <<'PY'
          import json, pathlib

          corps = json.loads(
              pathlib.Path("artifacts/g0/perf-baseline.json").read_text(encoding="utf-8")
          )["payload"]
          print("Concurrence | p50 ms | p95 ms | p99 ms | req/s | erreurs")
          for nom, niveau in corps["levels"].items():
              a = niveau["aggregate"]
              lat = a["latency_ms"]
              print(
                  f"{nom:>11} | {lat['p50']:>6} | {lat['p95']:>6} | {lat['p99']:>6} "
                  f"| {a['throughput_rps']:>5} | {a['errors']}/{a['samples']}"
              )
          print("\nErreurs par type :", corps["errors_by_type_total"] or "aucune")
          print("Interrupteurs externes :", corps["environment"]["effective_external_switches"])
          PY

      - name: Confirm the governance statuses are unchanged
        run: |
          clinique=$(tr -d '[:space:]' < docs/governance/CLINICAL_STATUS)
          distribution=$(tr -d '[:space:]' < docs/governance/DISTRIBUTION_STATUS)
          echo "CLINICAL_STATUS=$clinique"
          echo "DISTRIBUTION_STATUS=$distribution"
          test "$clinique" = "REAL_DATA_NO_GO" || { echo "::error::CLINICAL_STATUS modifié"; exit 1; }
          test "$distribution" = "DISTRIBUTION_NO_GO" || { echo "::error::DISTRIBUTION_STATUS modifié"; exit 1; }

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Publish the performance baseline
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: g0-performance-baseline
          path: |
            artifacts/g0/perf-baseline.json
            artifacts/g0/perf-provenance.json
            image-id.txt
            image-archive-sha256.txt
          if-no-files-found: error
          retention-days: 90

      # Rien ne survit à ce job : conteneurs, réseaux et volumes sont détruits.
      # Un volume PostgreSQL laissé derrière porterait le jeu synthétique de la
      # mesure, et une exécution suivante mesurerait une base déjà peuplée.
      - name: Tear down the stack and its volumes
        if: always()
        run: |
          docker compose -f docker-compose.yml -f scripts/g0_perf_overlay.yml \
            down -v --remove-orphans
          docker volume ls
